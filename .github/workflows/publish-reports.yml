name: Publish reports to GitHub Pages

# Genera los HTML combinados (Fanatical / Humble / ambos) y los publica en GH Pages.
# Requiere: Settings → Pages → Source = GitHub Actions
on:
  workflow_dispatch:
    inputs:
      source:
        description: Which combined report(s) to generate
        type: choice
        options:
          - both
          - fanatical
          - humble
        default: both
      pretty:
        description: Use --pretty HTML
        type: boolean
        default: true
  workflow_call:
    inputs:
      source:
        description: Which combined report(s) to generate
        type: string
        default: both
      pretty:
        description: Use --pretty HTML
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 22.04 evita el fallo de libasound2 en noble (24.04) con deps antiguas
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import playwright; print('playwright', getattr(playwright, '__version__', 'unknown'))"
          python -m playwright install --with-deps chromium
          echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Generate Fanatical combined report
        if: ${{ inputs.source == 'both' || inputs.source == 'fanatical' }}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          PRETTY_FLAG=""
          if [ "${{ inputs.pretty }}" = "true" ]; then PRETTY_FLAG="--pretty"; fi
          pytest tests/test_fanatical_all_bundles_combined.py -s $PRETTY_FLAG \
            --html-output all_fanatical_pick_and_mix_combined

      - name: Generate Humble combined report
        if: ${{ inputs.source == 'both' || inputs.source == 'humble' }}
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          PRETTY_FLAG=""
          if [ "${{ inputs.pretty }}" = "true" ]; then PRETTY_FLAG="--pretty"; fi
          pytest tests/test_humble_all_bundles_combined.py -s $PRETTY_FLAG \
            --html-output all_humble_game_bundles_combined

      # Si solo regeneramos una fuente, conservamos el HTML de la otra desde Pages
      - name: Restore missing reports from live Pages
        continue-on-error: true
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p reports
          for f in \
            all_fanatical_pick_and_mix_combined_pretty.html \
            all_fanatical_pick_and_mix_combined.html \
            all_humble_game_bundles_combined_pretty.html \
            all_humble_game_bundles_combined.html
          do
            if [ ! -f "reports/$f" ]; then
              echo "Trying $PAGES_BASE/$f"
              curl -fsSL "$PAGES_BASE/$f" -o "reports/$f" && echo "Restored $f" || echo "Skip $f"
            fi
          done

      - name: Build site folder
        run: |
          mkdir -p site
          python .github/scripts/build_pages_index.py
          ls -la site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
